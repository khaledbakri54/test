<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ricciocaprese — Pop-up Catalogue</title>
<meta name="theme-color" content="#2a1a10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2a1a10;
    --glass: rgba(38, 26, 18, .62);
    --glass-line: rgba(255, 236, 210, .14);
    --cream: #f3ead9;
    --muted: rgba(243, 234, 217, .62);
    --navy: #17456f;
    --sky: #a8c8e9;
    --wa: #25d366;
    --ar: "IBM Plex Sans Arabic", system-ui, sans-serif;
    --serif: "Cormorant Garamond", Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--cream); font-family: var(--ar); -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .glass { background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(16px) saturate(1.2); -webkit-backdrop-filter: blur(16px) saturate(1.2); }
  .ui { transition: opacity .45s ease; }
  body.playing .ui:not(.brand) { opacity: 0; pointer-events: none; }

  /* brand (top right in RTL) */
  .brand { position: fixed; top: 16px; right: 16px; z-index: 5; padding: 10px 18px; border-radius: 14px; text-align: center; }
  .brand b { display: block; font-weight: 600; font-size: 18px; }
  .brand span { display: block; font-family: var(--serif); font-weight: 600; font-size: 12px; letter-spacing: .42em; color: var(--sky); direction: ltr; margin-top: 1px; }

  /* tools (top left) */
  .tools { position: fixed; top: 16px; left: 16px; z-index: 5; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .tool-row { display: flex; gap: 6px; padding: 6px; border-radius: 14px; flex-wrap: wrap; justify-content: flex-end; }
  .tool { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; font-size: 13px; color: var(--cream); transition: background .2s; white-space: nowrap; }
  .tool:hover, .tool.on { background: rgba(255, 236, 210, .14); }
  .tool svg { flex: none; }
  .tool[hidden] { display: none; }
  .hint { font-size: 12px; color: var(--muted); padding: 0 6px; }

  /* arrows */
  .arrow { position: fixed; top: 50%; z-index: 5; width: 52px; height: 52px; margin-top: -26px; border-radius: 50%; display: grid; place-items: center; transition: transform .2s, opacity .2s; }
  .arrow:hover { transform: scale(1.08); }
  .arrow:disabled { opacity: .25; cursor: default; transform: none; }
  .arrow.next { left: 18px; }
  .arrow.prev { right: 18px; }

  /* bottom */
  .bottom { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 5; width: min(860px, calc(100% - 32px)); display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .dots { display: flex; gap: 4px; align-items: center; padding: 5px; border-radius: 999px; }
  .dots button { font-family: var(--serif); font-weight: 600; font-size: 14px; width: 36px; height: 28px; border-radius: 999px; color: var(--muted); direction: ltr; transition: all .2s; }
  .dots button.on { background: var(--cream); color: #2a1a10; }
  .note { font-size: 11px; color: var(--muted); }
  .panel { width: 100%; border-radius: 20px; padding: 14px 18px; display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 18px; align-items: center; }
  .count, .dots button, .price b { font-variant-numeric: lining-nums; }
  .count { font-family: var(--serif); font-weight: 600; font-size: 22px; direction: ltr; color: var(--sky); }
  .names b { display: block; font-size: 20px; font-weight: 600; line-height: 1.2; }
  .names span { display: block; font-family: var(--serif); font-weight: 600; letter-spacing: .28em; font-size: 12px; color: var(--muted); direction: ltr; text-align: right; }
  .finishes { display: flex; gap: 6px; }
  .finish { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 12px; border-radius: 999px; border: 1px solid transparent; font-size: 12.5px; transition: all .2s; }
  .finish i { width: 22px; height: 22px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(255,255,255,.25); flex: none; }
  .finish.on { border-color: var(--cream); background: rgba(255, 236, 210, .1); }
  .finish:hover { background: rgba(255, 236, 210, .08); }
  .price { text-align: center; line-height: 1; white-space: nowrap; }
  .price b { font-family: var(--serif); font-weight: 600; font-size: 34px; }
  .price small { font-size: 13px; color: var(--muted); margin-right: 4px; }
  .wa { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-radius: 14px; background: var(--wa); color: #fff; font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap; transition: filter .2s; }
  .wa:hover { filter: brightness(1.08); }

  /* toast + loader */
  .toast { position: fixed; top: 84px; left: 50%; transform: translate(-50%, -20px); opacity: 0; z-index: 20; padding: 10px 18px; border-radius: 999px; font-size: 13px; transition: all .35s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .loader { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--bg); transition: opacity .8s; text-align: center; }
  .loader.gone { opacity: 0; pointer-events: none; }
  .loader b { display: block; font-size: 28px; font-weight: 600; }
  .loader span { display: block; font-family: var(--serif); letter-spacing: .5em; color: var(--sky); margin-top: 6px; direction: ltr; }
  .loader i { display: block; width: 120px; height: 2px; margin: 22px auto 0; background: rgba(255,255,255,.12); position: relative; overflow: hidden; }
  .loader i::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--sky); animation: load 1.2s ease-in-out infinite; }
  @keyframes load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

  /* owner drawer (left on desktop) */
  .drawer { position: fixed; top: 0; bottom: 0; left: 0; z-index: 30; width: 380px; max-width: 100%; padding: 18px; overflow-y: auto; border-radius: 0 20px 20px 0; transform: translateX(-105%); transition: transform .4s ease; direction: rtl; }
  .drawer.open { transform: none; }
  .drawer h3 { font-size: 18px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  .tabs { display: flex; gap: 4px; margin: 14px 0; }
  .tabs button { flex: 1; padding: 8px 0; border-radius: 8px; font-family: var(--serif); font-weight: 600; direction: ltr; color: var(--muted); }
  .tabs button.on { background: var(--cream); color: #2a1a10; }
  .field { display: block; margin-top: 10px; font-size: 12px; color: var(--muted); }
  .field input, .field textarea { display: block; width: 100%; margin-top: 4px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--glass-line); background: rgba(0,0,0,.25); color: var(--cream); font-size: 14px; }
  .field textarea { min-height: 88px; resize: vertical; line-height: 1.6; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--sky); }
  .field.ltr input { direction: ltr; text-align: left; }
  .fgroup { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--glass-line); }
  .fgroup > p { font-size: 13px; font-weight: 600; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 80px; gap: 6px; }
  .actions { display: flex; gap: 8px; margin-top: 18px; position: sticky; bottom: 0; padding: 10px 0 0; }
  .btn { flex: 1; padding: 11px; border-radius: 10px; background: var(--cream); color: #2a1a10; font-weight: 600; font-size: 14px; }
  .btn.ghost { background: rgba(255,255,255,.08); color: var(--cream); }
  .btn.warn { background: #9a3b2a; color: #fff; }
  .saved { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px; }

  @media (max-width: 760px) {
    .tool .lbl { display: none; }
    .tool { padding: 8px 9px; }
    .hint { display: none; }
    .brand { padding: 8px 12px; }
    .brand b { font-size: 15px; }
    .arrow { width: 42px; height: 42px; top: 38%; margin-top: 0; }
    .bottom { bottom: 10px; width: calc(100% - 20px); gap: 6px; }
    .panel { grid-template-columns: 1fr auto; gap: 10px 12px; padding: 12px 14px; }
    .count { display: none; }
    .names b { font-size: 17px; }
    .finishes { grid-column: 1 / -1; order: 3; justify-content: center; }
    .finish span { display: none; }
    .finish.on span { display: inline; }
    .wa { grid-column: 1 / -1; order: 4; justify-content: center; }
    .dots button { width: 30px; }
    .drawer { top: auto; height: 78vh; width: 100%; border-radius: 20px 20px 0 0; transform: translateY(105%); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; animation: none !important; } }
</style>
</head>
<body>
<canvas id="scene" aria-label="كتالوج ثلاثي الأبعاد"></canvas>

<div class="loader" id="loader"><div><b>ريتشوكابريزي</b><span>RICCIOCAPRESE</span><i></i></div></div>

<header class="brand glass ui"><b>ريتشوكابريزي</b><span>RICCIOCAPRESE</span></header>

<div class="tools ui">
  <div class="tool-row glass">
    <button class="tool" id="tPlay"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5z"/></svg><span class="lbl">تشغيل تلقائي</span></button>
    <button class="tool" id="tSpin"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M20 4v5h-5"/></svg><span class="lbl">تدوير 360°</span></button>
    <button class="tool" id="tZoom"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5M11 8v6M8 11h6"/></svg><span class="lbl">قرّب القطعة</span></button>
    <button class="tool" id="tHome"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><span class="lbl">الوضع الأصلي</span></button>
    <button class="tool" id="tAdmin" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg><span class="lbl">لوحة التحكم</span></button>
  </div>
  <p class="hint">اسحب للتدوير · انقر على العيّنات المطبوعة · انقر طرف الصفحة لقلبها</p>
</div>

<button class="arrow next glass ui" id="next" aria-label="التالي"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 5l-7 7 7 7"/></svg></button>
<button class="arrow prev glass ui" id="prev" aria-label="السابق"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 5l7 7-7 7"/></svg></button>

<div class="bottom ui">
  <div class="dots glass" id="dots"></div>
  <p class="note">المجسّمات توضيحية · كل قطعة مصنوعة يدوياً في كابري وقد تختلف قليلاً</p>
  <div class="panel glass" id="panel">
    <span class="count" id="count">01 / 05</span>
    <div class="names"><b id="nameAr"></b><span id="nameEn"></span></div>
    <div class="finishes" id="finishes"></div>
    <div class="price"><b id="price"></b><small>د.أ</small></div>
    <a class="wa" id="wa" target="_blank" rel="noopener">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35zM12.05 21.8h-.01a9.8 9.8 0 0 1-5-1.37l-.36-.21-3.72.98 1-3.63-.24-.37a9.82 9.82 0 0 1 15.27-12.12A9.75 9.75 0 0 1 21.86 12c0 5.42-4.41 9.82-9.81 9.82zm8.35-18.16A11.76 11.76 0 0 0 12.05.18C5.54.18.25 5.47.24 11.98c0 2.08.54 4.11 1.58 5.9L.15 24l6.25-1.64a11.8 11.8 0 0 0 5.64 1.44h.01c6.5 0 11.8-5.3 11.8-11.81 0-3.15-1.23-6.12-3.45-8.35z"/></svg>
      <span>اطلب عبر واتساب</span>
    </a>
  </div>
</div>

<aside class="drawer glass" id="drawer" aria-label="لوحة التحكم">
  <h3>لوحة التحكم <button class="tool" id="dClose" aria-label="إغلاق">✕</button></h3>
  <div class="tabs" id="dTabs"></div>
  <div id="dForm"></div>
  <div class="fgroup">
    <label class="field ltr">رقم واتساب المحل (بدون + مثل 9627XXXXXXXX)<input id="dWa" maxlength="16" inputmode="numeric"></label>
  </div>
  <div class="actions">
    <button class="btn" id="dSave">حفظ</button>
    <button class="btn ghost" id="dReset">استرجاع الافتراضي</button>
  </div>
  <p class="saved" id="dSaved"></p>
</aside>

<div class="toast glass" id="toast"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

/* =========================================================================
   1. SHOP DATA  (defaults — the owner panel edits a copy of this)
   ========================================================================= */
const GLAZE = {
  "Azzurro Capri": "#3fa7dc", "Rosso": "#cf2a2e", "Bianco": "#f2efe6", "Blu Notte": "#1f2d4f",
  "Corallo": "#ee7560", "Grigio Perla": "#c9c8c1", "Lilla": "#b49dd2", "Ciclamino": "#c43579",
  "Giallo": "#f0c133", "Acquamarina": "#5fb9b3", "Blu Capri": "#1f5ea8", "Verde Ramino": "#1f5e4a",
  "Bordeaux": "#6e1b2c", "Nero": "#1d1d1d"
};
const LIQUID = "#efdc9c";

const DEFAULTS = {
  whatsapp: "",
  products: [
    { shape: "riccio", ar: "ريتشو", en: "RICCIO", title: "RICCIO", subtitle: "THE SEA URCHIN · M12",
      desc: "القطعة التي بدأت الحكاية. قنفذ بحر من البورسلان، مزجّج يدوياً في كابري، يتوّج زجاجة معطّر برائحتك المفضّلة.",
      dims: "", delivery: "يتم ترتيب التوصيل معك عند تأكيد الطلب", extraLabel: "السعة", extraValue: "200 مل · أعواد قصب طبيعي",
      finishes: [{ g: "Azzurro Capri", ar: "أزرق كابري", en: "AZZURRO CAPRI", price: 100 }, { g: "Rosso", ar: "أحمر", en: "ROSSO", price: 100 }, { g: "Bianco", ar: "أبيض", en: "BIANCO", price: 100 }] },
    { shape: "lady", ar: "ليدي كابري", en: "LADY CAPRI", title: "LADY CAPRI", subtitle: "AN ICON, REDRAWN · M10",
      desc: "الريتشو بقامة أطول وأكثر رشاقة. قطعة هادئة تضيف لمسة احتفال لأي رف أو طاولة.",
      dims: "", delivery: "يتم ترتيب التوصيل معك عند تأكيد الطلب", extraLabel: "السعة", extraValue: "200 مل · أعواد قصب طبيعي",
      finishes: [{ g: "Blu Notte", ar: "كحلي", en: "BLU NOTTE", price: 115 }, { g: "Corallo", ar: "مرجاني", en: "CORALLO", price: 115 }, { g: "Grigio Perla", ar: "رمادي لؤلؤي", en: "GRIGIO PERLA", price: 115 }] },
    { shape: "dalia", ar: "داليا", en: "DALIA", title: "DALIA", subtitle: "PETALS IN BLOOM · M12",
      desc: "طبقة فوق طبقة من البتلات المشكّلة باليد، تتفتّح مثل زهرة الداليا تحت شمس كابري.",
      dims: "", delivery: "يتم ترتيب التوصيل معك عند تأكيد الطلب", extraLabel: "السعة", extraValue: "200 مل · أعواد قصب طبيعي",
      finishes: [{ g: "Lilla", ar: "ليلكي", en: "LILLA", price: 100 }, { g: "Ciclamino", ar: "فوشي", en: "CICLAMINO", price: 100 }, { g: "Giallo", ar: "أصفر", en: "GIALLO", price: 100 }] },
    { shape: "anemone", ar: "أنيموني", en: "ANEMONE", title: "ANEMONE", subtitle: "BORN FROM THE SEA · M12",
      desc: "مجسّات ناعمة متجمّعة على شكل شقائق النعمان البحرية. قطعة من شعاب كابري في بيتك.",
      dims: "", delivery: "يتم ترتيب التوصيل معك عند تأكيد الطلب", extraLabel: "السعة", extraValue: "200 مل · أعواد قصب طبيعي",
      finishes: [{ g: "Acquamarina", ar: "أكوامارين", en: "ACQUAMARINA", price: 100 }, { g: "Blu Capri", ar: "أزرق كابري", en: "BLU CAPRI", price: 100 }, { g: "Bianco", ar: "أبيض", en: "BIANCO", price: 100 }] },
    { shape: "regina", ar: "ريجينا", en: "REGINA", title: "REGINA", subtitle: "THE RICCIO, EVOLVED · 300 ML",
      desc: "قنفذ بحر متوّج بأشواك أطول وأجرأ. ملكة المجموعة، وحضورها لا يُخطئه أحد.",
      dims: "", delivery: "يتم ترتيب التوصيل معك عند تأكيد الطلب", extraLabel: "السعة", extraValue: "300 مل · أعواد قصب طبيعي",
      finishes: [{ g: "Verde Ramino", ar: "أخضر نحاسي", en: "VERDE RAMINO", price: 140 }, { g: "Bordeaux", ar: "عنابي", en: "BORDEAUX", price: 140 }, { g: "Nero", ar: "أسود", en: "NERO", price: 140 }] }
  ]
};
const N = DEFAULTS.products.length;
const clone = o => JSON.parse(JSON.stringify(o));
let DATA = clone(DEFAULTS);
const finishSel = new Array(N).fill(0);

// Clean anything loaded from storage: strings only, trimmed, length-capped; prices numeric.
const LIMITS = { ar: 40, en: 40, title: 24, subtitle: 48, desc: 360, dims: 60, delivery: 80, extraLabel: 30, extraValue: 60 };
function sanitize(raw) {
  const out = clone(DEFAULTS);
  if (!raw || typeof raw !== "object") return out;
  const str = (v, max, fb) => (typeof v === "string" ? v.replace(/[\u0000-\u001f<>]/g, " ").trim().slice(0, max) : fb);
  if (typeof raw.whatsapp === "string") out.whatsapp = raw.whatsapp.replace(/\D/g, "").slice(0, 16);
  if (Array.isArray(raw.products)) raw.products.slice(0, N).forEach((p, i) => {
    if (!p || typeof p !== "object") return;
    const d = out.products[i];
    for (const k in LIMITS) d[k] = str(p[k], LIMITS[k], d[k]);
    if (Array.isArray(p.finishes)) p.finishes.slice(0, 3).forEach((f, j) => {
      if (!f || typeof f !== "object") return;
      d.finishes[j].ar = str(f.ar, 30, d.finishes[j].ar);
      d.finishes[j].en = str(f.en, 30, d.finishes[j].en);
      const pr = Number(f.price);
      if (Number.isFinite(pr)) d.finishes[j].price = Math.max(0, Math.min(99999, Math.round(pr)));
    });
  });
  return out;
}
const pad2 = n => String(n + 1).padStart(2, "0");

/* =========================================================================
   2. RENDERER / SCENE
   ========================================================================= */
const isMobile = () => innerWidth < 760;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const BG = new THREE.Color("#2a1a10");
scene.background = BG;
scene.fog = new THREE.Fog(BG, 7, 17);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

(function windowFrame() {
  const s = new THREE.Shape();
  s.moveTo(-10, -10); s.lineTo(10, -10); s.lineTo(10, 10); s.lineTo(-10, 10); s.lineTo(-10, -10);
  const paneW = 1.05, paneH = 3.4, gap = 0.16;
  for (let k = -1; k <= 1; k++) {

/* ---------- procedural canvas textures ---------- */
function makeCanvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }

function walnutTexture() {
  const W = 2048, H = 2048, c = makeCanvas(W, H), x = c.getContext("2d"), r = rand(7);
  const planks = 8, ph = H / planks;

    x.fillStyle = `hsl(${22 + r() * 6}, ${38 + r() * 8}%, ${base * 0.55}%)`;
    x.fillRect(0, y0, W, ph);
    // grain: long wavy lines across the plank (planks run across the screen)
    for (let g = 0; g < 140; g++) {
      const yy = y0 + r() * ph, amp = 2 + r() * 10, f = 0.002 + r() * 0.004, ph0 = r() * 10;
      x.strokeStyle = `rgba(${r() < 0.5 ? "20,10,4" : "120,72,40"},${0.08 + r() * 0.16})`;
      x.lineWidth = 0.6 + r() * 2.2;
      x.beginPath();
      for (let xx = 0; xx <= W; xx += 16) x.lineTo(xx, yy + Math.sin(xx * f + ph0) * amp + Math.sin(xx * f * 3.1) * amp * 0.3);
      x.stroke();

    for (let k = 0; k < 2; k++) {
      const kx = r() * W, ky = y0 + ph * (0.3 + r() * 0.4);
      for (let q = 7; q > 0; q--) { x.strokeStyle = `rgba(25,12,5,${0.08 * q / 3})`; x.lineWidth = 1.5; x.beginPath(); x.ellipse(kx, ky, q * 7, q * 3, 0, 0, Math.PI * 2); x.stroke(); }
    }

}

}

// page block stacks (profile follows pageH, extruded along the page height)
function stack(side) {

  g.translate(0, 0, -PH / 2);

  const sideTex = stripeTexture(true); sideTex.wrapS = sideTex.wrapT = THREE.RepeatWrapping; sideTex.repeat.set(260, 1);

// static page surfaces
function pageGeo(side) {

  for (let i = 0; i < p.count; i++) {

  const a = j * (SX + 1) + i, b = a + 1, c = a + SX + 1, d = c + 1;

}
function sheetGeo(uv) {

}

const smooth = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const easeInOutCubic = t => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);

// Shape the sheet around the spine. alpha0 = 0 → lying on the left, π → lying on the right.
const SP_S = 0.5;              // where the piece stands, as a fraction of page width
const sheetAnchor = { pos: new THREE.Vector3(), angle: 0 };
function shapeSheet(alpha0, t, dir) {
  const K = 1.15 * Math.sin(Math.PI * t);
  const ds = PW / SX;
  const land = smooth(0, 0.35, Math.min(alpha0, Math.PI - alpha0));
  for (let j = 0; j <= SY; j++) {
    const Kj = K * (0.9 + 0.2 * (j / SY)) * (1 + 0.06 * Math.sin(j * 1.3));
    let x = 0, y = 0;
    const z = -PH / 2 + (j / SY) * PH;
    for (let i = 0; i <= SX; i++) {
      const s = i * ds;
      if (i > 0) {
        const sm = s - ds / 2;
        const a = Math.max(0, Math.min(Math.PI, alpha0 - dir * Kj * sm / PW));
        x += -Math.cos(a) * ds; y += Math.sin(a) * ds;
        if (j === SY / 2 && Math.abs(sm - SP_S) < ds / 2 + 1e-6) sheetAnchor.angle = a;
      }
      const base = THREE.MathUtils.lerp(pageH(s / PW), pageH(0.3), land) + 0.003;
      sheetPos.setXYZ(j * (SX + 1) + i, x, y + base, z);
      if (j === SY / 2 && Math.abs(s - SP_S) < 1e-6) sheetAnchor.pos.set(x, y + base, z + 0.02);

  if (sheetBack.geometry.attributes.normal !== sheetFront.geometry.attributes.normal) sheetBack.geometry.setAttribute("normal", sheetFront.geometry.attributes.normal);

/* =========================================================================
   4. PORCELAIN PIECES (built in code; 1 unit ≈ 13 cm in real life)
   ========================================================================= */
const MM_PER_UNIT = 130;
function glazeMat(hex) { return new THREE.MeshPhysicalMaterial({ color: hex, roughness: 0.2, clearcoat: 1, clearcoatRoughness: 0.06, sheen: 0.25, sheenColor: 0xffffff }); }
const glassMat = () => new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.03, transmission: 1, thickness: 0.35, ior: 1.5, transparent: true });

function fib(n, minY) {
  const pts = [], g = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) { const y = 1 - (i / (n - 1)) * 2; if (y < minY) continue; const r = Math.sqrt(1 - y * y), t = g * i; pts.push(new THREE.Vector3(Math.cos(t) * r, y, Math.sin(t) * r)); }
  return pts;
}
function spikeGeo(rad, h) {
  const pts = [];
  for (let i = 0; i <= 10; i++) { const t = i / 10; pts.push(new THREE.Vector2(rad * (1 - t) ** 1.3 + 0.005, t * h)); }
  pts.push(new THREE.Vector2(0, h + 0.005));

}

  const dirs = fib(n, minY), mesh = new THREE.InstancedMesh(spikeGeo(sr, sh), mat, dirs.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0);

    m.compose(p, q, new THREE.Vector3(1, 0.8 + ((i * 0.618) % 1) * jit * 2, 1)); mesh.setMatrixAt(i, m);

}
function petalGeo(w, l, cup) { const g = new THREE.SphereGeometry(1, 18, 10, 0, Math.PI, 0, Math.PI); g.scale(w, l / 2, cup); g.translate(0, l / 2, 0); return g; }

  const c = new THREE.Mesh(new THREE.SphereGeometry(r * 0.24, 20, 14), mat); c.position.y = r * 0.55; g.add(c);
  for (let k = 0; k < rings; k++) {

book.add(pageSlot.holder, sheetSlot.holder);

/* =========================================================================
   5. TECHNICAL DRAWINGS — rendered from the 3D model itself
   ========================================================================= */
const drawRenderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, alpha: true });
const DRW = 300, DRH = 380;
drawRenderer.setSize(DRW, DRH, false);
const drawings = [];
function technicalDrawing(i) {
  if (drawings[i]) return drawings[i];
  const m = buildPiece(i, 0);
  const sc = new THREE.Scene();
  let id = 1;
  m.traverse(o => {
    if (!o.isMesh) return;
    if (o.userData.reed) { o.visible = false; return; }
    const c = new THREE.Color().setHSL((id * 0.618) % 1, 0.9, 0.35 + (id % 3) * 0.15); id++;
    o.material = new THREE.MeshBasicMaterial({ color: c });

  const half = Math.max(size.x, size.y, size.z) * 0.56;
  const asp = DRW / DRH;

    if (hit.uv.x < 0.12) return go(cur + 1);
  } else if (hit.object === rightPage) {
    if (hit.uv.x > 0.88) return go(cur - 1);
  } else {
    zoomed ? home() : zoomPiece();
  }
});
// swatch rects are recorded while drawing; make sure they belong to the current page
let hitsFor = -1;
function drawLeftHits(i) { if (hitsFor !== i) { drawLeft(i); hitsFor = i; } }

function go(i) { if (startTurn(i)) hitsFor = -1; }
$("next").onclick = () => go(cur + 1);
$("prev").onclick = () => go(cur - 1);
addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  if (playing) { stopAutoplay(); return; }
  if (e.key === "ArrowLeft") go(cur + 1);
  if (e.key === "ArrowRight") go(cur - 1);
  if (e.key === "Escape") { closeDrawer(); home(); }
});
let spinning = false;
$("tSpin").onclick = () => { spinning = !spinning; $("tSpin").classList.toggle("on", spinning); };
$("tZoom").onclick = () => (zoomed ? home() : zoomPiece());
$("tHome").onclick = () => { spinning = false; $("tSpin").classList.remove("on"); home(); };

/* ---------- bottom panel ---------- */
function syncUI() {
  const p = DATA.products[cur], f = p.finishes[finishSel[cur]];
  $("count").textContent = `${pad2(cur)} / ${pad2(N - 1)}`;
  $("nameAr").textContent = p.ar;
  $("nameEn").textContent = p.en.toUpperCase();
  $("price").textContent = f.price;
  const fin = $("finishes"); fin.replaceChildren();
  p.finishes.forEach((ff, k) => {
    const b = document.createElement("button");
    b.className = "finish" + (k === finishSel[cur] ? " on" : "");
    const i = document.createElement("i");
    i.style.background = `linear-gradient(135deg, ${GLAZE[DEFAULTS.products[cur].finishes[k].g]} 50%, ${LIQUID} 50%)`;
    const s = document.createElement("span"); s.textContent = ff.ar;
    b.append(i, s); b.onclick = () => setFinish(k);
    b.setAttribute("aria-label", ff.ar);
    fin.append(b);
  });
  const dots = $("dots"); dots.replaceChildren();
  for (let k = 0; k < N; k++) { const b = document.createElement("button"); b.textContent = pad2(k); if (k === cur) b.className = "on"; b.onclick = () => go(k); dots.append(b); }
  $("next").disabled = cur >= N - 1; $("prev").disabled = cur <= 0;
  const msg = `مرحباً، أرغب بطلب:\n${p.ar} (${p.en})\nالخامة: ${f.ar} / ${f.en}\nالسعر: ${f.price} د.أ`;
  const num = DATA.whatsapp.replace(/\D/g, "");
  $("wa").href = `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
}
function toast(t, ms = 2400) { const el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), ms); }

/* =========================================================================
   10. AUTOPLAY (for filming reels)
   ========================================================================= */
let playing = false, playToken = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function autoplay() {
  const token = ++playToken;
  playing = true; document.body.classList.add("playing"); $("tPlay").classList.add("on");
  toast("اضغط في أي مكان للإيقاف", 2600);
  fitCamera(false);
  const alive = () => playing && token === playToken;
  while (alive()) {
    await sleep(500); if (!alive()) break;
    const startFinish = finishSel[cur];
    autoSpin = true;
    await tweenCam({ target: pieceCenter(), dist: fitState.dist * 0.5, polar: 1.0, az: 0.7 }, 1800); if (!alive()) break;
    for (let k = 1; k <= 3; k++) { await sleep(1800); if (!alive()) break; setFinish((startFinish + k) % 3); }
    if (!alive()) break;
    autoSpin = false;
    await tweenCam({ target: fitState.target, dist: fitState.dist, polar: POLAR, az: 0 }, 1400); if (!alive()) break;
    await sleep(400); if (!alive()) break;
    go(cur >= N - 1 ? 0 : cur + 1);
    await waitTurn();
  }
}
let autoSpin = false;
function stopAutoplay() {
  if (!playing) return;
  playing = false; playToken++; autoSpin = false; camTween = null;
  document.body.classList.remove("playing"); $("tPlay").classList.remove("on");
  pageSlot.spin.rotation.y = 0;
  fitCamera(true);
  if (location.hash === "#autoplay") history.replaceState(null, "", location.pathname + location.search);
}
$("tPlay").onclick = e => { e.stopPropagation(); playing ? stopAutoplay() : autoplay(); };
document.addEventListener("pointerdown", e => { if (playing && !e.target.closest("#tPlay")) stopAutoplay(); }, true);

/* =========================================================================
   11. OWNER PANEL  (claude db when available, otherwise localStorage)
   ========================================================================= */
const LS_KEY = "ricciocaprese-book-v1";
let remote = null, tab = 0;
function lsGet() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch { return null; } }
function lsSet(v) { try { localStorage.setItem(LS_KEY, JSON.stringify(v)); return true; } catch { return false; } }

function applyData(d, redrawAll = true) {
  DATA = sanitize(d);
  if (redrawAll) { for (let i = 0; i < N; i++) invalidate(i); hitsFor = -1; if (!turn) showPage(cur); }
  syncUI();
  if ($("drawer").classList.contains("open")) buildForm();
}
let redrawT = null;
// sanitize without replacing the objects the form fields are bound to
function cleanInPlace() {
  const c = sanitize(DATA);
  DATA.whatsapp = c.whatsapp;
  DATA.products.forEach((p, i) => {
    for (const k in LIMITS) p[k] = c.products[i][k];
    p.finishes.forEach((f, j) => Object.assign(f, c.products[i].finishes[j]));
  });
}
function scheduleRedraw(i) {
  clearTimeout(redrawT);
  redrawT = setTimeout(() => { cleanInPlace(); invalidate(i); hitsFor = -1; if (!turn && i === cur) showPage(cur); syncUI(); }, 180);
}
function field(label, value, onInput, { multi = false, ltr = false, max = 60, type = "text" } = {}) {
  const l = document.createElement("label"); l.className = "field" + (ltr ? " ltr" : "");
  l.append(document.createTextNode(label));
  const el = document.createElement(multi ? "textarea" : "input");
  if (!multi) el.type = type;
  el.maxLength = max; el.value = value ?? "";
  el.addEventListener("input", () => onInput(el.value));
  l.append(el);
  return l;
}
function buildForm() {
  const tabs = $("dTabs"); tabs.replaceChildren();
  for (let k = 0; k < N; k++) { const b = document.createElement("button"); b.textContent = pad2(k); if (k === tab) b.className = "on"; b.onclick = () => { tab = k; if (k !== cur) go(k); buildForm(); }; tabs.append(b); }
  const p = DATA.products[tab], f = $("dForm"); f.replaceChildren();
  const set = k => v => { p[k] = v; scheduleRedraw(tab); };
  f.append(
    field("الاسم العربي", p.ar, set("ar"), { max: LIMITS.ar }),
    field("الاسم الإنجليزي", p.en, set("en"), { ltr: true, max: LIMITS.en }),
    field("عنوان الصفحة", p.title, set("title"), { ltr: true, max: LIMITS.title }),
    field("العنوان الفرعي", p.subtitle, set("subtitle"), { ltr: true, max: LIMITS.subtitle }),
    field("الوصف", p.desc, set("desc"), { multi: true, max: LIMITS.desc }),
    field("المقاسات (فارغ = تلقائي من النموذج)", p.dims, set("dims"), { max: LIMITS.dims }),
    field("التسليم", p.delivery, set("delivery"), { max: LIMITS.delivery }),
    field("مواصفة إضافية — العنوان", p.extraLabel, set("extraLabel"), { max: LIMITS.extraLabel }),
    field("مواصفة إضافية — القيمة", p.extraValue, set("extraValue"), { max: LIMITS.extraValue })
  );
  p.finishes.forEach((fi, k) => {
    const g = document.createElement("div"); g.className = "fgroup";
    const h = document.createElement("p"); h.textContent = `الخامة ${k + 1}`; g.append(h);
    const row = document.createElement("div"); row.className = "grid3";
    row.append(
      field("عربي", fi.ar, v => { fi.ar = v; scheduleRedraw(tab); }, { max: 30 }),
      field("إنجليزي", fi.en, v => { fi.en = v; scheduleRedraw(tab); }, { ltr: true, max: 30 }),
      field("السعر", fi.price, v => { fi.price = v; scheduleRedraw(tab); }, { ltr: true, max: 6, type: "number" })
    );
    g.append(row); f.append(g);
  });
  $("dWa").value = DATA.whatsapp;
  resetArmed = false; $("dReset").textContent = "استرجاع الافتراضي"; $("dReset").classList.remove("warn");
}
$("dWa").addEventListener("input", e => { DATA.whatsapp = e.target.value.replace(/\D/g, "").slice(0, 16); syncUI(); });
function openDrawer() { tab = cur; buildForm(); $("drawer").classList.add("open"); }
function closeDrawer() { $("drawer").classList.remove("open"); }
$("tAdmin").onclick = () => ($("drawer").classList.contains("open") ? closeDrawer() : openDrawer());
$("dClose").onclick = closeDrawer;
$("dSave").onclick = async () => {
  const clean = sanitize(DATA);
  $("dSaved").textContent = "جارٍ الحفظ…";
  try {
    if (remote) await remote.set({ json: JSON.stringify(clean), updatedAt: Date.now() });
    else if (!lsSet(clean)) throw new Error("storage");
    $("dSaved").textContent = remote ? "تم الحفظ — يظهر لكل من يفتح الكتالوج" : "تم الحفظ على هذا الجهاز";
  } catch (err) { $("dSaved").textContent = "تعذّر الحفظ، حاول مرة أخرى"; }
};
let resetArmed = false;
$("dReset").onclick = () => {
  if (!resetArmed) { resetArmed = true; $("dReset").textContent = "اضغط مرة ثانية للتأكيد"; $("dReset").classList.add("warn"); return; }
  DATA.products[tab] = clone(DEFAULTS.products[tab]);
  applyData(DATA); toast("تم استرجاع بيانات القطعة — اضغط حفظ لتثبيتها");
};

async function initStorage() {
  const local = lsGet(); if (local) applyData(local);
  const claudeRT = window.claude;
  if (!claudeRT?.use) {
    // Plain hosting: the panel is shown to the owner via #admin in the URL.
    if (/admin/.test(location.hash)) $("tAdmin").hidden = false;
    return;
  }
  try {
    const [db, user] = await Promise.all([claudeRT.use("db"), claudeRT.use("user")]);
    if (user && (await user.canEdit())) $("tAdmin").hidden = false;
    if (db) {
      remote = db.doc("catalog/main");
      remote.onSnapshot(snap => {
        const d = snap.data();
        if (d && typeof d.json === "string") { try { applyData(JSON.parse(d.json)); } catch {} }
      }, () => {});
    }
  } catch {}
}

/* =========================================================================
   12. LOOP + BOOT
   ========================================================================= */
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  fitCamera(false);
}
addEventListener("resize", resize);

let lastT = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  updateTurn(now);
  for (const slot of [pageSlot]) {
    if (slot.popAnim && now >= slot.popAnim.t0) {
      const t = Math.min(1, (now - slot.popAnim.t0) / slot.popAnim.dur);
      setPop(slot, reduceMotion ? t : easeOutBack(t));
      if (t >= 1) { slot.popAnim = null; setPop(slot, 1); }
    }
  }
  if (pageSlot.pulse) {
    const t = (now - pageSlot.pulse) / 380;
    pageSlot.spin.scale.setScalar(1 + Math.sin(Math.min(1, t) * Math.PI) * 0.06);
    if (t >= 1) { pageSlot.pulse = 0; pageSlot.spin.scale.setScalar(1); }
  }
  if ((spinning || autoSpin) && !reduceMotion) pageSlot.spin.rotation.y += dt * (autoSpin ? 0.5 : 0.9);
  updateCamTween(now);
  if (!camTween) controls.update();
  renderer.render(scene, camera);
});

async function boot() {
  const fontsReady = Promise.all([
    document.fonts.load(LAT(500, 100)), document.fonts.load(LAT(600, 100)),
    document.fonts.load(ARF(400, 40), "مرحبا"), document.fonts.load(ARF(500, 40), "مرحبا"), document.fonts.load(ARF(600, 40), "مرحبا")
  ]);
  await Promise.race([fontsReady, sleep(5000)]);
  await initStorage();
  showPage(cur);
  fillSlot(pageSlot, cur); setPop(pageSlot, 0);
  syncUI();
  resize();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $("loader").classList.add("gone");
    popUp(pageSlot, 350);
    if (location.hash === "#autoplay") setTimeout(autoplay, 1200);
  }));
}
boot();
</script>
